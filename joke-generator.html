<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 50px 40px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .title {
      font-size: 2.5em;
      color: #00d4ff;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      font-weight: bold;
    }

    .subtitle {
      font-size: 1em;
      color: rgba(255, 255, 255, 0.6);
      font-style: italic;
    }

    .joke-container {
      background: rgba(0, 212, 255, 0.08);
      border: 2px solid rgba(0, 212, 255, 0.2);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 30px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: all 0.3s ease;
    }

    .joke-container:hover {
      border-color: rgba(0, 212, 255, 0.5);
      background: rgba(0, 212, 255, 0.15);
      transform: translateY(-5px);
    }

    .joke-category {
      display: inline-block;
      background: rgba(0, 212, 255, 0.3);
      color: #00d4ff;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 0.8em;
      margin-bottom: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .joke-text {
      color: white;
      font-size: 1.3em;
      line-height: 1.6;
      margin-bottom: 15px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .joke-loading {
      color: #00d4ff;
      font-size: 1.1em;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .joke-type {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9em;
      margin-top: 10px;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    button {
      padding: 14px 30px;
      font-size: 1em;
      border: 2px solid rgba(0, 212, 255, 0.4);
      background: rgba(0, 212, 255, 0.1);
      color: #00d4ff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: rgba(0, 212, 255, 0.25);
      border-color: rgba(0, 212, 255, 0.8);
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: scale(1);
    }

    .primary-btn {
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      border-color: #00d4ff;
      color: #1a1a2e;
      font-size: 1.1em;
      padding: 16px 40px;
    }

    .primary-btn:hover {
      box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
    }

    .category-selector {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 212, 255, 0.2);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .category-selector label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 0.95em;
    }

    .category-selector select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid rgba(0, 212, 255, 0.3);
      background: rgba(26, 26, 46, 0.8);
      color: #00d4ff;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .category-selector select:hover,
    .category-selector select:focus {
      border-color: rgba(0, 212, 255, 0.8);
      background: rgba(26, 26, 46, 1);
      outline: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .stat-label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85em;
      margin-bottom: 5px;
    }

    .stat-value {
      color: #00d4ff;
      font-size: 1.5em;
      font-weight: bold;
    }

    .error-message {
      background: rgba(255, 100, 100, 0.2);
      border: 2px solid rgba(255, 100, 100, 0.5);
      color: #ff6464;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .favorite-jokes {
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(0, 212, 255, 0.15);
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
    }

    .favorite-jokes h3 {
      color: #00d4ff;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .favorite-item {
      background: rgba(0, 212, 255, 0.05);
      border-left: 4px solid #00d4ff;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .favorite-item button {
      padding: 6px 12px;
      font-size: 0.8em;
      background: rgba(255, 100, 100, 0.2);
      border-color: rgba(255, 100, 100, 0.4);
      color: #ff6464;
    }

    .favorite-item button:hover {
      background: rgba(255, 100, 100, 0.3);
      box-shadow: 0 3px 10px rgba(255, 100, 100, 0.2);
    }

    .empty-favorites {
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      font-style: italic;
    }

    .copy-btn {
      padding: 8px 16px;
      font-size: 0.85em;
      background: rgba(0, 212, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.3);
      color: #00d4ff;
    }

    .copy-btn:hover {
      background: rgba(0, 212, 255, 0.25);
    }

    .api-info {
      font-size: 0.8em;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      .title {
        font-size: 1.8em;
      }

      .joke-text {
        font-size: 1.1em;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">😂 Joke Generator</div>
      <div class="subtitle">Get a random laugh every time!</div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="category-selector">
      <label for="categorySelect">Select Joke Category:</label>
      <select id="categorySelect">
        <option value="">Any Category</option>
        <option value="general">General</option>
        <option value="programming">Programming</option>
        <option value="knock-knock">Knock-Knock</option>
      </select>
    </div>

    <div class="joke-container" id="jokeContainer">
      <div class="joke-loading">🔄 Loading a joke for you...</div>
    </div>

    <div class="button-group">
      <button class="primary-btn" onclick="getJoke()">Get New Joke 🎲</button>
      <button onclick="shareJoke()">Share 📤</button>
      <button onclick="copyJoke()">Copy 📋</button>
      <button onclick="addToFavorites()">Favorite ❤️</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Jokes Generated</div>
        <div class="stat-value" id="jokeCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Favorites</div>
        <div class="stat-value" id="favoriteCount">0</div>
      </div>
    </div>

    <div class="favorite-jokes">
      <h3>❤️ Your Favorite Jokes</h3>
      <div id="favoritesList" class="empty-favorites">No favorites yet. Add some jokes you love!</div>
    </div>

    <div class="api-info">
      💡 Powered by JokeAPI | Updated in real-time
    </div>
  </div>

  <script>
    let currentJoke = null;
    let jokeCount = 0;
    let favorites = JSON.parse(localStorage.getItem('favoriteJokes')) || [];

    // Initialize
    window.addEventListener('load', () => {
      updateStats();
      displayFavorites();
      getJoke();
    });

    // Get a random joke
    async function getJoke() {
      const jokeContainer = document.getElementById('jokeContainer');
      const category = document.getElementById('categorySelect').value;
      const errorMessage = document.getElementById('errorMessage');

      try {
        errorMessage.classList.remove('show');
        jokeContainer.innerHTML = '<div class="joke-loading">🔄 Loading a joke for you...</div>';

        // Using JokeAPI - https://jokeapi.dev/
        let url = 'https://v2.jokeapi.dev/joke/';
        
        if (category === 'general') {
          url += 'Any?blacklistFlags=nsfw,religious,political,racist,sexist&format=json';
        } else if (category === 'programming') {
          url += 'Programming?format=json';
        } else if (category === 'knock-knock') {
          url += 'Knock-Knock?format=json';
        } else {
          url += 'Any?blacklistFlags=nsfw,religious,political,racist,sexist&format=json';
        }

        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error('Failed to fetch joke');
        }

        const data = await response.json();

        if (data.error) {
          throw new Error('No jokes available for this category');
        }

        currentJoke = data;
        displayJoke(data);
        jokeCount++;
        updateStats();

      } catch (error) {
        showError('Oops! Could not load a joke. Please try again. ' + error.message);
        jokeContainer.innerHTML = '<div class="joke-text">😔 Sorry, could not load a joke. Try again!</div>';
      }
    }

    // Display joke
    function displayJoke(joke) {
      const jokeContainer = document.getElementById('jokeContainer');
      let jokeHTML = '';

      if (joke.type === 'twopart') {
        jokeHTML = `
          <div class="joke-category">${joke.category}</div>
          <div class="joke-text">
            <div>
              <strong>Setup:</strong> ${joke.setup}<br><br>
              <strong>Punchline:</strong> ${joke.delivery}
            </div>
          </div>
          <div class="joke-type">Two-part Joke</div>
        `;
      } else {
        jokeHTML = `
          <div class="joke-category">${joke.category}</div>
          <div class="joke-text">${joke.joke}</div>
          <div class="joke-type">Single Joke</div>
        `;
      }

      jokeContainer.innerHTML = jokeHTML;
    }

    // Share joke
    function shareJoke() {
      if (!currentJoke) {
        showError('Please load a joke first');
        return;
      }

      let jokeText = '';
      if (currentJoke.type === 'twopart') {
        jokeText = `${currentJoke.setup}\n\n${currentJoke.delivery}`;
      } else {
        jokeText = currentJoke.joke;
      }

      const text = `😂 Check out this joke:\n\n${jokeText}\n\n#JokeGenerator`;

      // Try native share API
      if (navigator.share) {
        navigator.share({
          title: 'Funny Joke!',
          text: text
        }).catch(err => console.log('Share cancelled'));
      } else {
        // Fallback: Copy to clipboard
        navigator.clipboard.writeText(text).then(() => {
          showSuccess('Joke copied to clipboard! Ready to share.');
        });
      }
    }

    // Copy joke to clipboard
    function copyJoke() {
      if (!currentJoke) {
        showError('Please load a joke first');
        return;
      }

      let jokeText = '';
      if (currentJoke.type === 'twopart') {
        jokeText = `${currentJoke.setup}\n\n${currentJoke.delivery}`;
      } else {
        jokeText = currentJoke.joke;
      }

      navigator.clipboard.writeText(jokeText).then(() => {
        showSuccess('Joke copied to clipboard! 📋');
      }).catch(() => {
        showError('Could not copy to clipboard');
      });
    }

    // Add to favorites
    function addToFavorites() {
      if (!currentJoke) {
        showError('Please load a joke first');
        return;
      }

      const jokeText = currentJoke.type === 'twopart' 
        ? `${currentJoke.setup} | ${currentJoke.delivery}`
        : currentJoke.joke;

      if (favorites.some(fav => fav.text === jokeText)) {
        showError('This joke is already in your favorites!');
        return;
      }

      favorites.push({
        text: jokeText,
        category: currentJoke.category,
        type: currentJoke.type,
        timestamp: new Date().toLocaleString()
      });

      localStorage.setItem('favoriteJokes', JSON.stringify(favorites));
      updateStats();
      displayFavorites();
      showSuccess('Added to favorites! ❤️');
    }

    // Display favorites
    function displayFavorites() {
      const favoritesList = document.getElementById('favoritesList');
      
      if (favorites.length === 0) {
        favoritesList.innerHTML = '<div class="empty-favorites">No favorites yet. Add some jokes you love!</div>';
        return;
      }

      let html = '';
      favorites.forEach((fav, index) => {
        html += `
          <div class="favorite-item">
            <span>${fav.text.substring(0, 80)}${fav.text.length > 80 ? '...' : ''}</span>
            <button onclick="removeFavorite(${index})">Remove</button>
          </div>
        `;
      });

      favoritesList.innerHTML = html;
    }

    // Remove favorite
    function removeFavorite(index) {
      favorites.splice(index, 1);
      localStorage.setItem('favoriteJokes', JSON.stringify(favorites));
      updateStats();
      displayFavorites();
      showSuccess('Removed from favorites');
    }

    // Update statistics
    function updateStats() {
      document.getElementById('jokeCount').textContent = jokeCount;
      document.getElementById('favoriteCount').textContent = favorites.length;
    }

    // Show error message
    function showError(message) {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = '⚠️ ' + message;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 5000);
    }

    // Show success message
    function showSuccess(message) {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.style.borderColor = 'rgba(100, 255, 100, 0.5)';
      errorMessage.style.background = 'rgba(100, 255, 100, 0.2)';
      errorMessage.style.color = '#64ff64';
      errorMessage.textContent = '✅ ' + message;
      errorMessage.classList.add('show');
      setTimeout(() => {
        errorMessage.classList.remove('show');
        errorMessage.style.borderColor = 'rgba(255, 100, 100, 0.5)';
        errorMessage.style.background = 'rgba(255, 100, 100, 0.2)';
        errorMessage.style.color = '#ff6464';
      }, 5000);
    }

    // Get joke on category change
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('categorySelect').addEventListener('change', getJoke);
    });
  </script>
</body>
</html>

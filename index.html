<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Sefer League 3D Football</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  width:100%;
  height:100%;
}

#score{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.7);
  padding:10px 22px;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
  z-index:10;
}

#team{
  font-size:13px;
  margin-top:4px;
}

#timer{
  font-size:17px;
  color:#ffd700;
  margin-top:5px;
}

#message{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:28px;
  font-weight:bold;
  text-align:center;
  text-shadow:0 2px 8px #000;
  z-index:30;
  pointer-events:none;
  white-space:pre-line;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.4);
  z-index:20;
}

#stick{
  position:absolute;
  left:35px;
  top:35px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
}

.buttons{
  position:fixed;
  right:20px;
  bottom:30px;
  display:flex;
  gap:12px;
  z-index:20;
}

button{
  width:75px;
  height:75px;
  border:0;
  border-radius:50%;
  color:white;
  font-size:15px;
  font-weight:bold;
  border:2px solid rgba(255,255,255,.45);
}

#shoot{
  background:rgba(220,40,40,.85);
}

#pass{
  background:rgba(40,90,220,.85);
}

#newMatch{
  display:none;
  position:fixed;
  left:50%;
  top:62%;
  transform:translate(-50%,-50%);
  width:150px;
  height:55px;
  border-radius:12px;
  background:#168a35;
  z-index:40;
}
</style>
</head>

<body>

<div id="score">
  SEFER LEAGUE ⚽
  <div id="team">HOME 0 — 0 AWAY</div>
  <div id="timer">01:30</div>
</div>

<div id="game"></div>

<div id="message"></div>

<button id="newMatch">NEW MATCH</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div class="buttons">
  <button id="pass">PASS</button>
  <button id="shoot">SHOOT</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =========================
   SEFER LEAGUE 3D FOOTBALL
   ========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* LIGHT */

const sun = new THREE.DirectionalLight(
  0xffffff,
  1.4
);

sun.position.set(20,40,20);

scene.add(sun);

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    1
  )
);


/* FIELD */

const field = new THREE.Mesh(
  new THREE.BoxGeometry(42,.2,70),
  new THREE.MeshStandardMaterial({
    color:0x178a35
  })
);

field.position.y=-.1;

scene.add(field);


/* FIELD LINES */

function fieldLine(x,z,w,d){

  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,.03,d),
    new THREE.MeshBasicMaterial({
      color:0xffffff
    })
  );

  m.position.set(x,.02,z);

  scene.add(m);
}

fieldLine(0,-35,42,.2);
fieldLine(0,35,42,.2);
fieldLine(-21,0,.2,70);
fieldLine(21,0,.2,70);
fieldLine(0,0,42,.12);


/* CENTER CIRCLE */

const circle = new THREE.Mesh(
  new THREE.RingGeometry(
    5.9,
    6.1,
    64
  ),
  new THREE.MeshBasicMaterial({
    color:0xffffff,
    side:THREE.DoubleSide
  })
);

circle.rotation.x=-Math.PI/2;

circle.position.y=.04;

scene.add(circle);


/* GOALS */

function createGoal(z){

  const material =
    new THREE.MeshStandardMaterial({
      color:0xffffff
    });

  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(
      7,.35,.35
    ),
    material
  );

  bar.position.set(0,4,z);

  const left = new THREE.Mesh(
    new THREE.BoxGeometry(
      .35,4,.35
    ),
    material
  );

  left.position.set(-3.5,2,z);

  const right = new THREE.Mesh(
    new THREE.BoxGeometry(
      .35,4,.35
    ),
    material
  );

  right.position.set(3.5,2,z);

  scene.add(
    bar,
    left,
    right
  );
}

createGoal(-35);
createGoal(35);

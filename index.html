
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Sefer League 3D Football</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

#score{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:white;
  background:rgba(0,0,0,.7);
  padding:10px 22px;
  border-radius:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#team{
  font-size:13px;
  margin-top:3px;
}

#message{
  position:fixed;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  color:white;
  font-size:30px;
  font-weight:bold;
  text-shadow:0 2px 8px #000;
  pointer-events:none;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.20);
  border:3px solid rgba(255,255,255,.5);
  z-index:30;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:35px;
  top:35px;
  border-radius:50%;
  background:#ddd;
}

.buttons{
  position:fixed;
  right:20px;
  bottom:30px;
  display:flex;
  gap:12px;
  z-index:30;
}

button{
  width:78px;
  height:78px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.5);
  color:white;
  font-weight:bold;
  font-size:14px;
}

#pass{
  background:#2457c5;
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sefer League 3D Football - Full Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background: #000;
      width: 100vw;
      height: 100vh;
    }

    #gameContainer {
      width: 100%;
      height: 100%;
    }

    /* UI Elements */
    .ui-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Score Board */
    #scoreBoard {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px 40px;
      border-radius: 15px;
      border: 3px solid #00ff88;
      display: flex;
      align-items: center;
      gap: 30px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      z-index: 15;
    }

    .team-score {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-name {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .score-number {
      font-size: 48px;
      color: #ffd700;
      font-weight: bold;
    }

    .vs {
      font-size: 28px;
      color: #00ff88;
    }

    /* Timer */
    #timer {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 25px;
      border-radius: 12px;
      border: 2px solid #ffd700;
      font-size: 28px;
      color: #ffd700;
      font-weight: bold;
      z-index: 15;
    }

    /* Match Info */
    #matchInfo {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid #00d4ff;
      color: #00d4ff;
      font-size: 16px;
      z-index: 15;
    }

    /* Controls */
    .controls-container {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px;
      z-index: 20;
      pointer-events: auto;
    }

    /* Joystick */
    .joystick-area {
      width: 120px;
      height: 120px;
      background: rgba(0, 0, 0, 0.7);
      border: 3px solid #00ff88;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }

    #joystick {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #00ff88, #00dd77);
      border-radius: 50%;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.6);
      transition: all 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
    }

    #joystick:active {
      cursor: grabbing;
    }

    /* Action Buttons */
    .button-group {
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .action-btn {
      width: 80px;
      height: 80px;
      border: none;
      border-radius: 50%;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #passBtn {
      background: linear-gradient(135deg, #0099ff, #0077cc);
      border: 3px solid #0099ff;
      color: white;
    }

    #passBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0, 153, 255, 0.6);
    }

    #passBtn:active {
      transform: scale(0.95);
    }

    #shootBtn {
      background: linear-gradient(135deg, #ff0000, #cc0000);
      border: 3px solid #ff0000;
      color: white;
    }

    #shootBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
    }

    #shootBtn:active {
      transform: scale(0.95);
    }

    /* Stats Panel */
    #stats {
      position: absolute;
      left: 20px;
      bottom: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #00ff88;
      color: #00ff88;
      font-size: 13px;
      z-index: 15;
    }

    .stat-row {
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      min-width: 180px;
    }

    /* Game Status Modal */
    #gameStatus {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      padding: 40px;
      border-radius: 20px;
      border: 3px solid #00d4ff;
      color: white;
      text-align: center;
      z-index: 25;
      display: none;
      box-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
    }

    #gameStatus h2 {
      font-size: 48px;
      color: #00d4ff;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
    }

    #gameStatus p {
      font-size: 22px;
      margin: 15px 0;
      color: #ffd700;
    }

    #gameStatus button {
      margin-top: 20px;
      padding: 15px 40px;
      background: #00ff88;
      border: none;
      border-radius: 10px;
      color: black;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
    }

    #gameStatus button:hover {
      background: #00dd77;
      transform: scale(1.05);
    }

    /* Instructions */
    #instructions {
      position: absolute;
      bottom: 120px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #00d4ff;
      color: #00d4ff;
      font-size: 12px;
      max-width: 200px;
      z-index: 15;
    }

    .instruction-item {
      margin: 8px 0;
      padding: 5px;
      border-left: 3px solid #00ff88;
      padding-left: 10px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #scoreBoard {
        top: 10px;
        padding: 15px 20px;
        font-size: 18px;
        gap: 15px;
      }

      .score-number {
        font-size: 36px;
      }

      #timer {
        top: 10px;
        right: 10px;
        font-size: 20px;
        padding: 10px 15px;
      }

      #instructions {
        display: none;
      }

      .action-btn {
        width: 70px;
        height: 70px;
        font-size: 28px;
      }

      .joystick-area {
        width: 100px;
        height: 100px;
      }

      #joystick {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <div id="gameContainer"></div>

  <div class="ui-overlay">
    <!-- Score Board -->
    <div id="scoreBoard">
      <div class="team-score">
        <div class="team-name">🟢 HOME</div>
        <div class="score-number" id="homeScore">0</div>
      </div>
      <div class="vs">VS</div>
      <div class="team-score">
        <div class="team-name">🔵 AWAY</div>
        <div class="score-number" id="awayScore">0</div>
      </div>
    </div>

    <!-- Timer -->
    <div id="timer">45:00</div>

    <!-- Match Info -->
    <div id="matchInfo">
      ⚽ SEFER LEAGUE<br>
      Match Mode
    </div>

    <!-- Stats -->
    <div id="stats">
      <div class="stat-row">
        <span>Possession:</span>
        <span id="possession">50%</span>
      </div>
      <div class="stat-row">
        <span>Passes:</span>
        <span id="passes">0</span>
      </div>
      <div class="stat-row">
        <span>Shots:</span>
        <span id="shots">0</span>
      </div>
      <div class="stat-row">
        <span>Ball Speed:</span>
        <span id="ballSpeed">0</span>
      </div>
    </div>

    <!-- Instructions -->
    <div id="instructions">
      <div style="color: #00ff88; font-weight: bold; margin-bottom: 8px;">📋 Controls:</div>
      <div class="instruction-item">🕹️ Drag joystick to move</div>
      <div class="instruction-item">🔵 PASS - Short pass</div>
      <div class="instruction-item">🔴 SHOOT - Long shot</div>
      <div class="instruction-item">⌨️ WASD - Camera move</div>
      <div class="instruction-item">🖱️ Mouse - Look around</div>
    </div>

    <!-- Controls -->
    <div class="controls-container">
      <div class="joystick-area">
        <div id="joystick">🎮</div>
      </div>
      <div class="button-group">
        <button class="action-btn" id="passBtn" title="Pass">🔵<br>PASS</button>
        <button class="action-btn" id="shootBtn" title="Shoot">🔴<br>SHOOT</button>
      </div>
    </div>

    <!-- Game Status Modal -->
    <div id="gameStatus">
      <h2 id="statusTitle">Goal!</h2>
      <p id="statusMessage">HOME TEAM SCORES!</p>
      <button onclick="continueGame()">Continue Match</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Game Variables
    let scene, camera, renderer;
    let ball, players = [], field;
    let homeScore = 0, awayScore = 0;
    let gameTime = 2700; // 45 minutes
    let gameActive = true;
    let currentTeam = 'home';
    let stats = { passes: 0, shots: 0, possession: { home: 0, away: 0 } };

    // Joystick Variables
    let joystickActive = false;
    let joystickX = 0, joystickY = 0;
    const joystickElement = document.getElementById('joystick');
    const joystickArea = document.querySelector('.joystick-area');

    // Initialize Game
    function init() {
      // Scene Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 300, 800);

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 25, 45);
      camera.lookAt(0, 5, 0);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowShadowMap;
      document.getElementById('gameContainer').appendChild(renderer.domElement);

      // Lighting
      const sunlight = new THREE.DirectionalLight(0xffffff, 1.2);
      sunlight.position.set(100, 120, 50);
      sunlight.castShadow = true;
      sunlight.shadow.mapSize.width = 4096;
      sunlight.shadow.mapSize.height = 4096;
      sunlight.shadow.camera.far = 500;
      scene.add(sunlight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      // Create Field
      createField();

      // Create Ball
      createBall();

      // Create Players
      createPlayers();

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', handleKeyDown);
      window.addEventListener('keyup', handleKeyUp);

      // Joystick Events
      joystickElement.addEventListener('mousedown', startJoystick);
      joystickElement.addEventListener('touchstart', startJoystick);
      document.addEventListener('mousemove', moveJoystick);
      document.addEventListener('touchmove', moveJoystick);
      document.addEventListener('mouseup', endJoystick);
      document.addEventListener('touchend', endJoystick);

      // Button Events
      document.getElementById('passBtn').addEventListener('click', performPass);
      document.getElementById('shootBtn').addEventListener('click', performShoot);

      // Start Game
      animate();
      updateTimer();
    }

    // Create Field
    function createField() {
      // Ground
      const groundGeometry = new THREE.PlaneGeometry(140, 100);
      const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x1a5c1a });
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Field
      const fieldGeometry = new THREE.PlaneGeometry(135, 95);
      const fieldMaterial = new THREE.MeshLambertMaterial({ color: 0x22a522 });
      const fieldMesh = new THREE.Mesh(fieldGeometry, fieldMaterial);
      fieldMesh.rotation.x = -Math.PI / 2;
      fieldMesh.position.y = 0.01;
      fieldMesh.receiveShadow = true;
      scene.add(fieldMesh);

      // Field Lines
      const linesMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });

      // Center Line
      const centerLineGeometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-67.5, 0.02, 0),
        new THREE.Vector3(67.5, 0.02, 0)
      ]);
      const centerLine = new THREE.Line(centerLineGeometry, linesMaterial);
      scene.add(centerLine);

      // Goals
      createGoal(-67, 0, 'home');
      createGoal(67, 0, 'away');

      // Boundaries
      const boundaryMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: false });
      const boundaryGeometry = new THREE.BoxGeometry(2, 2, 100);
      const goalLine1 = new THREE.Mesh(boundaryGeometry, boundaryMaterial);
      goalLine1.position.set(-67, 1, 0);
      scene.add(goalLine1);

      const goalLine2 = new THREE.Mesh(boundaryGeometry, boundaryMaterial);
      goalLine2.position.set(67, 1, 0);
      scene.add(goalLine2);
    }

    // Create Goal
    function createGoal(x, z, type) {
      const goalGeometry = new THREE.BoxGeometry(3, 8, 20);
      const goalMaterial = new THREE.MeshStandardMaterial({
        color: type === 'home' ? 0x00ff00 : 0x0000ff,
        emissive: type === 'home' ? 0x00aa00 : 0x0000aa,
        metalness: 0.3
      });
      const goal = new THREE.Mesh(goalGeometry, goalMaterial);
      goal.position.set(x, 4, z);
      goal.castShadow = true;
      goal.receiveShadow = true;
      goal.userData = { type: 'goal', team: type };
      scene.add(goal);

      // Goal Net
      const netGeometry = new THREE.BoxGeometry(0.5, 8, 20);
      const netMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, wireframe: true });
      const net = new THREE.Mesh(netGeometry, netMaterial);
      net.position.set(x + 1.5, 4, z);
      scene.add(net);
    }

    // Create Ball
    function createBall() {
      const ballGeometry = new THREE.SphereGeometry(0.8, 32, 32);
      const ballMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.4,
        metalness: 0.1
      });
      ball = new THREE.Mesh(ballGeometry, ballMaterial);
      ball.position.set(0, 1, 0);
      ball.castShadow = true;
      ball.receiveShadow = true;
      ball.userData = {
        velocity: new THREE.Vector3(0, 0, 0),
        owner: 'home'
      };
      scene.add(ball);
    }

    // Create Players
    function createPlayers() {
      // Home Team (Green)
      const homePositions = [
        { x: -50, z: 0 },    // Goalkeeper
        { x: -35, z: -15 },  // Defender 1
        { x: -35, z: 15 },   // Defender 2
        { x: -15, z: -10 },  // Midfielder
        { x: 10, z: 0 }      // Striker
      ];

      homePositions.forEach((pos, i) => {
        const player = createPlayer(pos.x, pos.z, 0x00ff00, 'home', i);
        players.push(player);
      });

      // Away Team (Blue)
      const awayPositions = [
        { x: 50, z: 0 },     // Goalkeeper
        { x: 35, z: -15 },   // Defender 1
        { x: 35, z: 15 },    // Defender 2
        { x: 15, z: -10 },   // Midfielder
        { x: -10, z: 0 }     // Striker
      ];

      awayPositions.forEach((pos, i) => {
        const player = createPlayer(pos.x, pos.z, 0x0000ff, 'away', i + 5);
        players.push(player);
      });
    }

    // Create Player
    function createPlayer(x, z, color, team, id) {
      const playerGeometry = new THREE.CapsuleGeometry(0.6, 2, 4, 8);
      const playerMaterial = new THREE.MeshStandardMaterial({ color: color });
      const player = new THREE.Mesh(playerGeometry, playerMaterial);
      player.position.set(x, 1.2, z);
      player.castShadow = true;
      player.receiveShadow = true;
      player.userData = {
        team: team,
        id: id,
        velocity: new THREE.Vector3(0, 0, 0),
        targetPos: new THREE.Vector3(x, 1.2, z),
        homePos: new THREE.Vector3(x, 1.2, z),
        speed: 0.3,
        hasControl: id === 4 && team === 'home' // Player controls striker
      };
      scene.add(player);
      return player;
    }

    // Perform Pass
    function performPass() {
      if (!gameActive) return;

      const controlPlayer = players.find(p => p.userData.hasControl);
      if (!controlPlayer || controlPlayer.userData.team !== currentTeam) return;

      const direction = new THREE.Vector3();
      direction.subVectors(ball.position, controlPlayer.position).normalize();
      direction.y = 0.3;
      ball.userData.velocity = direction.multiplyScalar(2);

      stats.passes++;
      document.getElementById('passes').textContent = stats.passes;

      // Visual feedback
      document.getElementById('passBtn').style.transform = 'scale(0.9)';
      setTimeout(() => {
        document.getElementById('passBtn').style.transform = 'scale(1)';
      }, 100);
    }

    // Perform Shoot
    function performShoot() {
      if (!gameActive) return;

      const controlPlayer = players.find(p => p.userData.hasControl);
      if (!controlPlayer || controlPlayer.userData.team !== currentTeam) return;

      const direction = new THREE.Vector3();
      direction.subVectors(ball.position, controlPlayer.position).normalize();
      direction.y = 0.5;
      ball.userData.velocity = direction.multiplyScalar(4);

      stats.shots++;
      document.getElementById('shots').textContent = stats.shots;

      // Visual feedback
      document.getElementById('shootBtn').style.transform = 'scale(0.9)';
      setTimeout(() => {
        document.getElementById('shootBtn').style.transform = 'scale(1)';
      }, 100);

      checkGoal();
    }

    // Check Goal
    function checkGoal() {
      if (ball.position.y < 0.5) return;

      if (ball.position.x < -65 && Math.abs(ball.position.z) < 10) {
        awayScore++;
        goalScored('away');
      } else if (ball.position.x > 65 && Math.abs(ball.position.z) < 10) {
        homeScore++;
        goalScored('home');
      }
    }

    // Goal Scored
    function goalScored(team) {
      gameActive = false;
      updateScore();

      document.getElementById('statusTitle').textContent = team === 'home' ? '🟢 HOME GOAL!' : '🔵 AWAY GOAL!';
      document.getElementById('statusMessage').textContent = `${team.toUpperCase()} TEAM SCORES! 🎉`;
      document.getElementById('gameStatus').style.display = 'block';

      // Reset
      setTimeout(() => {
        ball.position.set(0, 1, 0);
        ball.userData.velocity.set(0, 0, 0);
        gameActive = true;
        document.getElementById('gameStatus').style.display = 'none';
      }, 3000);
    }

    // Continue Game
    function continueGame() {
      ball.position.set(0, 1, 0);
      ball.userData.velocity.set(0, 0, 0);
      gameActive = true;
      document.getElementById('gameStatus').style.display = 'none';
    }

    // Update Score
    function updateScore() {
      document.getElementById('homeScore').textContent = homeScore;
      document.getElementById('awayScore').textContent = awayScore;
    }

    // Update Timer
    function updateTimer() {
      setInterval(() => {
        if (gameActive && gameTime > 0) {
          gameTime--;
        }

        const minutes = Math.floor(gameTime / 60);
        const seconds = gameTime % 60;
        document.getElementById('timer').textContent =
          `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        // Update possession
        const possession = Math.round((stats.possession.home / (stats.possession.home + stats.possession.away || 1)) * 100);
        document.getElementById('possession').textContent = possession + '%';

        // Update ball speed
        const speed = Math.round(ball.userData.velocity.length() * 10) / 10;
        document.getElementById('ballSpeed').textContent = speed.toFixed(1);

        if (gameTime === 0) {
          endGame();
        }
      }, 1000);
    }

    // End Game
    function endGame() {
      gameActive = false;
      let result = homeScore > awayScore ? '🟢 HOME WINS!' : awayScore > homeScore ? '🔵 AWAY WINS!' : 'DRAW! 🤝';
      document.getElementById('statusTitle').textContent = 'FULL TIME';
      document.getElementById('statusMessage').textContent = `${homeScore} - ${awayScore}\n\n${result}`;
      document.getElementById('gameStatus').style.display = 'block';
    }

    // Joystick Controls
    function startJoystick(e) {
      joystickActive = true;
    }

    function moveJoystick(e) {
      if (!joystickActive) return;

      const rect = joystickArea.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      joystickX = (clientX - centerX) / (rect.width / 2);
      joystickY = (clientY - centerY) / (rect.height / 2);

      const distance = Math.sqrt(joystickX ** 2 + joystickY ** 2);
      if (distance > 1) {
        joystickX /= distance;
        joystickY /= distance;
      }

      const moveX = joystickX * 20;
      const moveY = joystickY * 20;

      joystickElement.style.transform = `translate(${moveX}px, ${moveY}px)`;

      // Move player
      const controlPlayer = players.find(p => p.userData.hasControl);
      if (controlPlayer) {
        controlPlayer.position.x += joystickX * 0.5;
        controlPlayer.position.z += joystickY * 0.5;
      }
    }

    function endJoystick() {
      joystickActive = false;
      joystickElement.style.transform = 'translate(0, 0)';
      joystickX = 0;
      joystickY = 0;
    }

    // Keyboard Controls
    const keys = {};

    function handleKeyDown(e) {
      keys[e.key.toLowerCase()] = true;
    }

    function handleKeyUp(e) {
      keys[e.key.toLowerCase()] = false;
    }

    // Animate
    function animate() {
      requestAnimationFrame(animate);

      // Update ball physics
      ball.position.add(ball.userData.velocity);
      ball.userData.velocity.y -= 0.08; // Gravity
      ball.userData.velocity.multiplyScalar(0.97); // Air resistance

      // Ball boundaries
      if (ball.position.y < 0.8) ball.position.y = 0.8;
      if (Math.abs(ball.position.x) > 75) ball.position.x = Math.sign(ball.position.x) * 75;
      if (Math.abs(ball.position.z) > 55) ball.position.z = Math.sign(ball.position.z) * 55;

      // Update players
      players.forEach(player => {
        const ballDist = player.position.distanceTo(ball.position);

        if (ballDist < 25 && !player.userData.hasControl) {
          player.userData.targetPos.copy(ball.position);
        } else if (!player.userData.hasControl) {
          player.userData.targetPos.copy(player.userData.homePos);
        }

        const direction = new THREE.Vector3().subVectors(player.userData.targetPos, player.position);
        if (direction.length() > 0.5) {
          direction.normalize().multiplyScalar(player.userData.speed);
          player.position.add(direction);
        }

        // Ball interaction
        if (ballDist < 2) {
          ball.userData.owner = player.userData.team;
          currentTeam = player.userData.team;
        }
      });

      // Camera controls
      if (keys['w'] || keys['arrowup']) camera.position.z -= 1;
      if (keys['s'] || keys['arrowdown']) camera.position.z += 1;
      if (keys['a'] || keys['arrowleft']) camera.position.x -= 1;
      if (keys['d'] || keys['arrowright']) camera.position.x += 1;

      camera.lookAt(ball.position.x, 5, ball.position.z);
      renderer.render(scene, camera);
    }

    // Window Resize
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Start Game
    window.addEventListener('load', init);
  </script>
</body>
</html>
